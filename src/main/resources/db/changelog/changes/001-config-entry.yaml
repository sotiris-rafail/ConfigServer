databaseChangeLog:
  - changeSet:
      id: 001-config-entry
      author: foundry
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: config_entry
      changes:
        - createTable:
            tableName: config_entry
            remarks: One setting for one application and profile
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_config_entry } }
              - column: { name: app_name, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: profile_name, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: prop_key, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: prop_value, type: VARCHAR(4000), constraints: { nullable: false } }
              - column: { name: secret, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: description, type: VARCHAR(300) }
              - column: { name: updated_at, type: TIMESTAMP WITH TIME ZONE, constraints: { nullable: false } }
              - column: { name: updated_by, type: VARCHAR(100) }
        - addUniqueConstraint:
            tableName: config_entry
            columnNames: app_name, profile_name, prop_key
            constraintName: uk_config_entry_key
