# History of changes, what each client last fetched (and whether it is switched off), and the admin's two-step sign-in.
databaseChangeLog:
  - changeSet:
      id: console-features-001
      author: foundry
      preConditions:
        - onFail: MARK_RAN
        - not:
            - tableExists:
                tableName: config_history
      changes:
        - createTable:
            tableName: config_history
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_config_history } }
              - column: { name: entry_id, type: BIGINT }
              - column: { name: app_name, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: profile_name, type: VARCHAR(50), constraints: { nullable: false } }
              - column: { name: prop_key, type: VARCHAR(200), constraints: { nullable: false } }
              - column: { name: action, type: VARCHAR(10), constraints: { nullable: false } }
              - column: { name: old_value, type: VARCHAR(4000) }
              - column: { name: new_value, type: VARCHAR(4000) }
              - column: { name: secret, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: changed_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: changed_by, type: VARCHAR(100) }
        - createIndex:
            tableName: config_history
            indexName: idx_config_history_at
            columns:
              - column: { name: changed_at }
        - createTable:
            tableName: client_state
            columns:
              - column: { name: client_id, type: VARCHAR(100), constraints: { primaryKey: true, primaryKeyName: pk_client_state, nullable: false } }
              - column: { name: disabled, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: last_token_at, type: TIMESTAMP }
              - column: { name: last_fetch_at, type: TIMESTAMP }
              - column: { name: last_fetch_app, type: VARCHAR(50) }
        - createTable:
            tableName: admin_totp
            columns:
              - column: { name: username, type: VARCHAR(100), constraints: { primaryKey: true, primaryKeyName: pk_admin_totp, nullable: false } }
              - column: { name: secret, type: VARCHAR(255), constraints: { nullable: false } }
              - column: { name: enabled, type: BOOLEAN, defaultValueBoolean: false, constraints: { nullable: false } }
              - column: { name: last_step, type: BIGINT, defaultValueNumeric: 0, constraints: { nullable: false } }
